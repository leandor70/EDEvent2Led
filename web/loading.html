<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ED:Event2Led - Loading</title>
<script type="text/javascript" src="/eel.js"></script>
<link href="css/fonts.css" rel="stylesheet">
<style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --accent: #FF6600;
        --accent-dim: rgba(255, 102, 0, 0.35);
        --bg: #05070a;
        --panel: rgba(18, 20, 24, 0.95);
        --text: #e0e0e0;
        --text-muted: rgba(224, 224, 224, 0.45);
    }

    html, body {
        width: 100%; height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        overflow: hidden;
    }

    /* ── Fonts ────────────────────────────────────── */
    /* Loaded via <link> in <head> for offline support */

    /* ── Background grid ─────────────────────────── */
    body::before {
        content: '';
        position: fixed; inset: 0; z-index: 0;
        background-image:
            linear-gradient(rgba(255,102,0,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,102,0,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
    }

    /* ── Centered container ─────────────────────── */
    .splash {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        opacity: 0;
        animation: fadeIn 0.4s ease-out 0.1s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    /* ── Corner accents (decorative) ─────────────── */
    .corner { position: absolute; width: 18px; height: 18px; }
    .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

    /* ── Card ─────────────────────────────────────── */
    .card {
        position: relative;
        width: min(480px, 90vw);
        padding: 48px 48px 40px;
        background: linear-gradient(135deg, rgba(20,22,26,0.97) 0%, rgba(10,12,14,0.99) 100%);
        border: 1px solid var(--accent-dim);
        box-shadow:
            0 0 40px rgba(0,0,0,0.6),
            inset 0 0 30px rgba(255,102,0,0.04);
    }

    /* ── Logo ─────────────────────────────────────── */
    .logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 36px;
        gap: 4px;
    }

    .logo-diamond {
        width: 10px; height: 10px;
        background: var(--accent);
        transform: rotate(45deg);
        margin-bottom: 16px;
        box-shadow: 0 0 12px rgba(255,102,0,0.7);
    }

    .logo-title {
        font-family: 'Orbitron', 'Courier New', monospace;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(255,102,0,0.4);
    }

    .logo-sub {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 2px;
    }

    /* ── Step message ─────────────────────────────── */
    .step-msg {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        text-align: center;
        min-height: 18px;
        margin-bottom: 16px;
        transition: opacity 0.2s;
    }

    /* ── Progress bar ─────────────────────────────── */
    .progress-track {
        width: 100%;
        height: 3px;
        background: rgba(255,102,0,0.12);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 14px;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #cc5200, #FF6600, #ff8533);
        border-radius: 2px;
        transition: width 0.4s ease;
        box-shadow: 0 0 8px rgba(255,102,0,0.5);
        width: 0%;
    }

    /* ── Step dots ────────────────────────────────── */
    .step-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
    }

    .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: rgba(255,102,0,0.2);
        border: 1px solid rgba(255,102,0,0.3);
        transition: background 0.3s, box-shadow 0.3s;
    }

    .dot.done {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 6px rgba(255,102,0,0.6);
    }

    .dot.active {
        background: rgba(255,102,0,0.6);
        border-color: var(--accent);
        animation: pulse-dot 0.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
        0%, 100% { transform: scale(1);   box-shadow: 0 0 4px rgba(255,102,0,0.4); }
        50%       { transform: scale(1.4); box-shadow: 0 0 10px rgba(255,102,0,0.8); }
    }

    /* ── Scanning line ────────────────────────────── */
    .scan-wrap {
        position: relative;
        width: 100%;
        height: 2px;
        margin-bottom: 28px;
        overflow: hidden;
    }

    .scan-line {
        position: absolute;
        top: 0; left: -40%;
        width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,102,0,0.7), transparent);
        animation: scan 1.8s linear infinite;
    }

    @keyframes scan {
        to { left: 140%; }
    }

    /* ── Fade-out on redirect ─────────────────────── */
    body.fade-out {
        transition: opacity 0.35s ease-out;
        opacity: 0;
    }

    /* ── Error state ──────────────────────────────── */
    .error-msg {
        display: none;
        font-size: 12px;
        color: #f87171;
        text-align: center;
        margin-top: 14px;
        padding: 8px 12px;
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        border-radius: 4px;
    }
    .error-msg.visible { display: block; }
</style>
</head>
<body>

<div class="splash">
    <div class="card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="logo-wrap">
            <div class="logo-diamond"></div>
            <div class="logo-title">ED:Event2Led</div>
            <div class="logo-sub" data-i18n="app.tagline">Elite Dangerous RGB Lighting Control</div>
        </div>

        <div class="scan-wrap">
            <div class="scan-line"></div>
        </div>

        <div class="step-msg" id="step-msg" data-i18n="pages.loading.initializing">Initializing system...</div>

        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="step-dots" id="step-dots">
            <!-- dots rendered by JS based on total_steps -->
        </div>

        <div class="error-msg" id="error-msg"></div>
    </div>
</div>

<!-- i18n (with fallback for early-stage loading) -->
<script src="js/i18n.js"></script>
<script>
// Initialize i18n (non-blocking, with fallback if eel not ready)
(async function() {
    try {
        if (typeof eel !== 'undefined') {
            const settings = await eel.get_settings()();
            const lang = settings?.language || 'en';
            await i18n.init(lang);
            i18n.apply();
        } else {
            // Eel not ready yet — fallback to English
            await i18n.init('en');
            i18n.apply();
        }
    } catch (error) {
        // Silent fail — keep hardcoded English text
    }
})();
</script>

<script>
// ── State ────────────────────────────────────────────
const TOTAL_STEPS = 5;
let lastStep = 0;
let redirecting = false;

// ── DOM refs ─────────────────────────────────────────
const msgEl    = document.getElementById('step-msg');
const fillEl   = document.getElementById('progress-fill');
const dotsEl   = document.getElementById('step-dots');
const errorEl  = document.getElementById('error-msg');

// ── Build dots ───────────────────────────────────────
(function buildDots() {
    for (let i = 0; i < TOTAL_STEPS; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = `dot-${i}`;
        dotsEl.appendChild(d);
    }
})();

// ── Update UI from status object ─────────────────────
function applyStatus(s) {
    const total = s.total || TOTAL_STEPS;
    const step  = s.step  || 0;

    // Message
    if (s.error) {
        msgEl.textContent    = (typeof i18n !== 'undefined' && i18n.get) ? i18n.get('pages.loading.error') : 'Initialization error';
        errorEl.textContent  = s.error;
        errorEl.classList.add('visible');
        return;
    }

    if (msgEl.textContent !== s.message) {
        msgEl.style.opacity = '0';
        setTimeout(() => {
            msgEl.textContent   = s.message || ((typeof i18n !== 'undefined' && i18n.get) ? i18n.get('common.loading') : 'Loading...');
            msgEl.style.opacity = '1';
        }, 100);
    }

    // Progress bar
    const pct = Math.min(100, Math.round((step / total) * 100));
    fillEl.style.width = pct + '%';

    // Dots
    for (let i = 0; i < total; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (!dot) continue;
        if (i < step)      dot.className = 'dot done';
        else if (i === step && step < total) dot.className = 'dot active';
        else               dot.className = 'dot';
    }

    lastStep = step;
}

// ── Poll backend ──────────────────────────────────────
async function poll() {
    if (redirecting) return;

    try {
        // eel.fnName()() — double-call is the Eel JS pattern
        const status = await eel.get_init_status()();

        applyStatus(status);

        if (status.ready && !redirecting) {
            redirecting = true;
            // Brief pause so user sees the "Ready" state
            setTimeout(() => {
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = 'index.html'; }, 350);
            }, 400);
            return;
        }
    } catch (e) {
        // Server not yet responding — keep polling silently
    }

    setTimeout(poll, 350);
}

// Start polling after a short delay to let eel.js connect
setTimeout(poll, 400);
</script>
</body>
</html>
