            word-wrap: normal;

        /* ========================================
           SCI-FI FORM CONTROLS - Elite Dangerous Theme
           ======================================== */
        select,
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        textarea {
            background-color: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 102, 0, 0.15) !important;
            color: #e0e0e0 !important;
            padding: 10px 12px !important;
            border-radius: 4px !important;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease !important;

        }

        select:hover,
        input[type="text"]:hover,
        input[type="number"]:hover,
        input[type="email"]:hover,
        input[type="password"]:hover,
        textarea:hover {
            background-color: rgba(0, 0, 0, 0.8) !important;
            border-color: rgba(255, 102, 0, 0.3) !important;
        }

        select:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            background-color: rgba(0, 0, 0, 0.9) !important;
            border-color: #FF6600 !important;
            outline: none !important;
            box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.2) !important;
        }

        /* Placeholder text styling */
        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 102, 0, 0.4);
            font-style: italic;
        }

        /* Disabled state */
        select:disabled,
        input:disabled,
        textarea:disabled {

            border-color: rgba(255, 255, 255, 0.05) !important;
            color: #666666 !important;
            cursor: not-allowed !important;

        /* Global scrollbar styling - applies to ALL scrollbars */
        *::-webkit-scrollbar { width: 6px; }
        *::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;

        *::-webkit-scrollbar-thumb {

            border-radius: 3px;
        }
        *::-webkit-scrollbar-thumb:hover {

        /* Specific overrides */

<script>
    // ========================================
    // FADE TRANSITIONS - Click to Black → Navigate → Fade from Black
    // ========================================

    // NOTE: Fade-in is triggered by log.js after i18n initialization
    // Fallback: show after 2.5s even if log.js doesn't trigger it
    setTimeout(function() {
        if (!document.body.classList.contains('loaded')) {
            console.warn('[Fade] Fallback: forcing fade-in after timeout');
            document.body.classList.add('loaded');
        }
    }, 2500);

    // Intercept navigation links for fade to black
    document.addEventListener('DOMContentLoaded', function() {
        // Set keyboard shortcut context
        if (typeof setShortcutContext === 'function') setShortcutContext('log');

        const links = document.querySelectorAll('a[href]');

        links.forEach(link => {
            // Skip external links, anchors, javascript:, and absolute URLs
            const href = link.getAttribute('href');
            if (!href ||
                href.startsWith('#') ||
                href.startsWith('javascript:') ||
                href.startsWith('http://') ||
                href.startsWith('https://') ||
                href.includes('://')) {
                return;
            }

            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.href;

                // Disable all links during transition
                document.body.style.pointerEvents = 'none';

                // Fade to black
                document.body.classList.remove('loaded');
                document.body.classList.add('fade-out');

                // Navigate after fade completes (300ms)
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 300);
            });
        });
    });
</script>
