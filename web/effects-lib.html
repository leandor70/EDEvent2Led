            border: 1px solid rgba(255, 102, 0, 0.2);

<script>
// ========================================
// COLOR TIMELINE VISUALIZATION
// ========================================

// Helper: Draw Breath effect (oscillating gradient between 2 colors)
function drawBreathSegment(ctx, x, y, width, height, color1, color2, numLoops) {
    // Each loop renders one complete color1->color2->color1 cycle
    const loops = Math.max(1, numLoops || 1);
    const cycleWidth = width / loops;

    for (let i = 0; i < loops; i++) {
        const cx = x + i * cycleWidth;
        const half = cycleWidth / 2;

        // First half: color1 -> color2
        const g1 = ctx.createLinearGradient(cx, y, cx + half, y);
        g1.addColorStop(0, color1);
        g1.addColorStop(1, color2);
        ctx.fillStyle = g1;
        ctx.fillRect(cx, y, half, height);

        // Second half: color2 -> color1
        const g2 = ctx.createLinearGradient(cx + half, y, cx + cycleWidth, y);
        g2.addColorStop(0, color2);
        g2.addColorStop(1, color1);
        ctx.fillStyle = g2;
        ctx.fillRect(cx + half, y, half, height);
    }
}

// Helper: Draw Color Cycle effect (n colors with smooth transitions)
function drawColorCycleSegment(ctx, x, y, width, height, colors) {
    const numColors = colors.length;
    const segmentWidth = width / numColors;

    for (let i = 0; i < numColors; i++) {
        const gradient = ctx.createLinearGradient(x + i * segmentWidth, y, x + (i + 1) * segmentWidth, y);

        const currentColor = colors[i];
        const nextColor = colors[(i + 1) % numColors];

        // Smooth transition between colors
        gradient.addColorStop(0, currentColor);
        gradient.addColorStop(0.7, currentColor);
        gradient.addColorStop(1, nextColor);

        ctx.fillStyle = gradient;
        ctx.fillRect(x + i * segmentWidth, y, segmentWidth, height);
    }
}

// Helper: Draw Static Transition (gradient from previous color to target)
function drawStaticTransitionSegment(ctx, x, y, width, height, fromColor, toColor) {
    const gradient = ctx.createLinearGradient(x, y, x + width, y);
    gradient.addColorStop(0, fromColor);
    gradient.addColorStop(1, toColor);

    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, width, height);
}

// Helper: Draw Spatial effect (multiple colors as bands/grid)
function drawSpatialSegment(ctx, x, y, width, height, colors, layout = 'horizontal') {
    const numColors = colors.length;

    if (layout === 'horizontal') {
        // Horizontal bands
        const bandHeight = height / numColors;
        colors.forEach((color, i) => {
            ctx.fillStyle = color;
            ctx.fillRect(x, y + i * bandHeight, width, bandHeight);
        });
    } else if (layout === 'vertical') {
        // Vertical bands
        const bandWidth = width / numColors;
        colors.forEach((color, i) => {
            ctx.fillStyle = color;
            ctx.fillRect(x + i * bandWidth, y, bandWidth, height);
        });
    } else if (layout === 'grid') {
        // 2x2 grid for Four Corner Nuance
        const halfWidth = width / 2;
        const halfHeight = height / 2;

        if (colors.length >= 4) {
            ctx.fillStyle = colors[0]; // Top-Left
            ctx.fillRect(x, y, halfWidth, halfHeight);

            ctx.fillStyle = colors[1]; // Top-Right
            ctx.fillRect(x + halfWidth, y, halfWidth, halfHeight);

            ctx.fillStyle = colors[2]; // Bottom-Left
            ctx.fillRect(x, y + halfHeight, halfWidth, halfHeight);

            ctx.fillStyle = colors[3]; // Bottom-Right
            ctx.fillRect(x + halfWidth, y + halfHeight, halfWidth, halfHeight);
        }
    }
}

function renderColorTimeline() {
    const canvas = document.getElementById('colorTimeline');
    if (!canvas) {
        console.warn('Canvas #colorTimeline not found');
        return;
    }

    const ctx = canvas.getContext('2d');
    const width = canvas.width = canvas.offsetWidth;
    const height = canvas.height;

    // Clear canvas
    ctx.clearRect(0, 0, width, height);

    // Get step data from DOM
    const steps = [];
    const stepCards = document.querySelectorAll('.step-card');

    console.log(`Found ${stepCards.length} step cards`);

    stepCards.forEach((card, index) => {
        // Find duration input
        const durationInput = card.querySelector('.step-duration');

        // Find ALL color inputs (for multi-color effects)
        const colorInputs = card.querySelectorAll('.step-color');

        // Find effect type select
        const effectSelect = card.querySelector('.step-type');

        const colors = [];
        colorInputs.forEach(input => {
            const colorValue = input.value && input.value.startsWith('#') ? input.value : '#0055FF';
            colors.push(colorValue);
        });

        console.log(`Step ${index + 1}:`, {
            hasDuration: !!durationInput,
            numColors: colors.length,
            hasSelect: !!effectSelect,
            duration: durationInput ? durationInput.value : 'N/A',
            colors: colors,
            effectType: effectSelect ? effectSelect.value : 'N/A'
        });

        if (durationInput && colors.length > 0) {
            const duration = parseInt(durationInput.value) || 500;
            const effectType = effectSelect ? effectSelect.value : 'static_transition';
            const numLoopsInput = card.querySelector('.param-num-loops');
            const numLoops = numLoopsInput ? parseInt(numLoopsInput.value) || 1 : 1;

            steps.push({
                duration: duration,
                colors: colors,
                effectType: effectType,
                numLoops: numLoops,
                name: (effectSelect && effectSelect.selectedIndex >= 0 && effectSelect.options[effectSelect.selectedIndex]) ? effectSelect.options[effectSelect.selectedIndex].text : 'Effect',
                index: index + 1
            });
        }
    });

    console.log(`Rendering ${steps.length} steps:`, steps);

    if (steps.length === 0) {
        console.warn('No steps found to render');
        return;
    }

    // Calculate total duration
    const totalDuration = steps.reduce((sum, step) => sum + step.duration, 0);

    // Update duration display
    const totalDurationEl = document.getElementById('totalDuration');
    const endTimeEl = document.getElementById('endTime');
    if (totalDurationEl) {
        totalDurationEl.textContent = `Total: ${totalDuration >= 1000 ? (totalDuration / 1000).toFixed(1) + 's' : totalDuration + 'ms'}`;
    }
    if (endTimeEl) {
        endTimeEl.textContent = totalDuration >= 1000 ? (totalDuration / 1000).toFixed(1) + 's' : totalDuration + 'ms';
    }

    // Drawing parameters
    const padding = 20;
    const timelineHeight = 60;
    const timelineY = 20;
    const labelY = timelineY + timelineHeight + 15;

    // Draw background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(padding, timelineY, width - padding * 2, timelineHeight);

    // Draw each step using effect-specific rendering
    let currentX = padding;
    let cumulativeTime = 0;

    steps.forEach((step, index) => {
        const stepWidth = ((width - padding * 2) * step.duration) / totalDuration;

        // Determine previous color for static_transition
        const prevColor = index > 0 ? steps[index - 1].colors[0] : '#000000';

        // Render based on effect type
        switch (step.effectType) {
            case 'breath':
                // Oscillating gradient between 2 colors
                if (step.colors.length >= 2) {
                    drawBreathSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors[0], step.colors[1], step.numLoops);
                } else {
                    // Fallback to solid color
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'color_cycle':
                // Multiple colors with smooth transitions
                if (step.colors.length >= 2) {
                    drawColorCycleSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors);
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'static_transition':
                // Gradient from previous color to target color
                drawStaticTransitionSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, prevColor, step.colors[0]);
                break;

            case 'four_corner_nuance':
                // 2x2 grid of 4 colors
                if (step.colors.length >= 4) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'grid');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'bloom':
                // Temporal palette: 5 colours from t=0% to t=100% (horizontal bands)
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'explosion_ring': {
                // 2 colours: ring peak (left) + decaying trail (right → black)
                if (step.colors.length >= 2) {
                    const ringCol  = step.colors[0];
                    const trailCol = step.colors[1];
                    const halfW    = stepWidth * 0.35;   // ring occupies 35% of width

                    // Left band: black → ring peak (ring approaching)
                    const gRing = ctx.createLinearGradient(currentX, 0, currentX + halfW, 0);
                    gRing.addColorStop(0, 'rgba(0,0,0,0)');
                    gRing.addColorStop(1, ringCol);
                    ctx.fillStyle = gRing;
                    ctx.fillRect(currentX, timelineY, halfW, timelineHeight);

                    // Right band: trail colour fading to black
                    const gTrail = ctx.createLinearGradient(currentX + halfW, 0, currentX + stepWidth, 0);
                    gTrail.addColorStop(0, trailCol);
                    gTrail.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gTrail;
                    ctx.fillRect(currentX + halfW, timelineY, stepWidth - halfW, timelineHeight);
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;
            }

            case 'two_color_nuance':
                // 2 horizontal bands (spatial gradient)
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'wave':
                // Wave: 2 colors with directional gradient visualization
                if (step.colors.length >= 2) {
                    // Draw horizontal gradient to represent wave propagation
                    const gradient = ctx.createLinearGradient(currentX, 0, currentX + stepWidth, 0);
                    gradient.addColorStop(0, step.colors[0]);
                    gradient.addColorStop(1, step.colors[1]);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);

                    // Add directional indicator (small arrow)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('→', currentX + stepWidth / 2, timelineY + timelineHeight / 2 + 4);
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'bump':
                // Bump: 2 colors with bidirectional gradient (bounce-back)
                if (step.colors.length >= 2) {
                    // Draw gradient to center then reverse (bounce effect visualization)
                    const halfWidth = stepWidth / 2;

                    // Left half: color1 → color2
                    const gradient1 = ctx.createLinearGradient(currentX, 0, currentX + halfWidth, 0);
                    gradient1.addColorStop(0, step.colors[0]);
                    gradient1.addColorStop(1, step.colors[1]);
                    ctx.fillStyle = gradient1;
                    ctx.fillRect(currentX, timelineY, halfWidth, timelineHeight);

                    // Right half: color2 → color1 (bounce back)
                    const gradient2 = ctx.createLinearGradient(currentX + halfWidth, 0, currentX + stepWidth, 0);
                    gradient2.addColorStop(0, step.colors[1]);
                    gradient2.addColorStop(1, step.colors[0]);
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(currentX + halfWidth, timelineY, halfWidth, timelineHeight);

                    // Add bidirectional indicator (arrows)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⇄', currentX + stepWidth / 2, timelineY + timelineHeight / 2 + 4);
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'plasma':
                // 5-color palette: horizontal bands showing the gradient palette
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'aurora':
                // 3-color bands: curtain-fall gradient from top to bottom
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'ocean_waves':
                // 3-color bands: deep water, surface, wave crest
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'fire':
                // 2-color bands: background bottom, flame top
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'glitch':
                // 4-color bands: glitch palette colors
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            case 'matrix_rain':
                // 3-color bands: background, trail, head
                if (step.colors.length >= 2) {
                    drawSpatialSegment(ctx, currentX, timelineY, stepWidth, timelineHeight, step.colors, 'horizontal');
                } else {
                    ctx.fillStyle = step.colors[0];
                    ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                }
                break;

            default:
                // Fallback: solid color (first color)
                ctx.fillStyle = step.colors[0];
                ctx.fillRect(currentX, timelineY, stepWidth, timelineHeight);
                break;
        }

        // Draw step label
        ctx.font = '10px Orbitron, monospace';
        ctx.textAlign = 'center';
        const labelX = currentX + stepWidth / 2;

        // Step number
        ctx.fillStyle = '#FF6600';
        ctx.fillText(`Step ${step.index}`, labelX, labelY);

        // Duration
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '9px Rajdhani, sans-serif';
        const durationText = step.duration >= 1000 ? (step.duration / 1000).toFixed(1) + 's' : step.duration + 'ms';
        ctx.fillText(durationText, labelX, labelY + 12);

        // Move to next position
        currentX += stepWidth;
        cumulativeTime += step.duration;
    });

    // Draw time markers at step boundaries
    currentX = padding;
    cumulativeTime = 0;

    steps.forEach((step, index) => {
        const stepWidth = ((width - padding * 2) * step.duration) / totalDuration;

        // Draw marker line at step boundary (except first)
        if (index > 0) {
            ctx.strokeStyle = 'rgba(255, 102, 0, 0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(currentX, timelineY);
            ctx.lineTo(currentX, timelineY + timelineHeight);
            ctx.stroke();
            ctx.setLineDash([]);

            // Time label above marker
            ctx.fillStyle = '#FF6600';
            ctx.font = 'bold 9px Rajdhani, sans-serif';
            ctx.textAlign = 'center';
            const timeText = cumulativeTime >= 1000 ? (cumulativeTime / 1000).toFixed(2) + 's' : cumulativeTime + 'ms';
            ctx.fillText(timeText, currentX, timelineY - 5);
        }

        currentX += stepWidth;
        cumulativeTime += step.duration;
    });

    // Draw tick marks (intermediate time markers)
    const timelineWidth = width - padding * 2;
    const tickInterval = totalDuration <= 2000 ? 250 : totalDuration <= 5000 ? 500 : 1000; // 250ms, 500ms or 1s intervals

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';  // Increased opacity: 0.15 → 0.4
    ctx.lineWidth = 1.5;  // Increased width: 1 → 1.5
    ctx.setLineDash([3, 3]);  // Increased dash: [2,2] → [3,3]

    for (let time = tickInterval; time < totalDuration; time += tickInterval) {
        const tickX = padding + (timelineWidth * time / totalDuration);

        // Check if this position is too close to a step boundary marker (avoid overlap)
        let tooClose = false;
        let cumTime = 0;
        for (let i = 0; i < steps.length; i++) {
            cumTime += steps[i].duration;
            const boundaryX = padding + (timelineWidth * cumTime / totalDuration);
            if (Math.abs(tickX - boundaryX) < 15) { // 15px tolerance
                tooClose = true;
                break;
            }
        }

        if (!tooClose) {
            // Draw tick line (shorter than boundary markers)
            ctx.beginPath();
            ctx.moveTo(tickX, timelineY + timelineHeight * 0.2);
            ctx.lineTo(tickX, timelineY + timelineHeight * 0.8);
            ctx.stroke();

            // Add small label below timeline for major ticks
            if (time % 1000 === 0) { // Only for full seconds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = '8px Rajdhani, sans-serif';
                ctx.textAlign = 'center';
                const tickLabel = (time / 1000).toFixed(1) + 's';
                ctx.fillText(tickLabel, tickX, timelineY + timelineHeight + 8);
            }
        }
    }

    ctx.setLineDash([]);

    // Draw outer border
    ctx.strokeStyle = 'rgba(255, 102, 0, 0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(padding, timelineY, width - padding * 2, timelineHeight);

    // Draw corner accents (sci-fi style)
    const cornerSize = 8;
    ctx.strokeStyle = '#FF6600';
    ctx.lineWidth = 2;

    // Top-left corner
    ctx.beginPath();
    ctx.moveTo(padding, timelineY + cornerSize);
    ctx.lineTo(padding, timelineY);
    ctx.lineTo(padding + cornerSize, timelineY);
    ctx.stroke();

    // Top-right corner
    ctx.beginPath();
    ctx.moveTo(width - padding - cornerSize, timelineY);
    ctx.lineTo(width - padding, timelineY);
    ctx.lineTo(width - padding, timelineY + cornerSize);
    ctx.stroke();

    // Bottom-left corner
    ctx.beginPath();
    ctx.moveTo(padding, timelineY + timelineHeight - cornerSize);
    ctx.lineTo(padding, timelineY + timelineHeight);
    ctx.lineTo(padding + cornerSize, timelineY + timelineHeight);
    ctx.stroke();

    // Bottom-right corner
    ctx.beginPath();
    ctx.moveTo(width - padding - cornerSize, timelineY + timelineHeight);
    ctx.lineTo(width - padding, timelineY + timelineHeight);
    ctx.lineTo(width - padding, timelineY + timelineHeight - cornerSize);
    ctx.stroke();
}

// Helper function to convert hex to RGBA
function hexToRGBA(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Duration controls sync
document.addEventListener('DOMContentLoaded', function() {
    // Function to format duration display
    function formatDuration(ms) {
        if (ms >= 1000 && ms % 1000 === 0) {
            return (ms / 1000) + 's';
        }
        return ms + 'ms';
    }

    // Function to update active preset button
    function updateActivePreset(target, value) {
        const presetButtons = document.querySelectorAll(`button[data-target="${target}"]`);
        presetButtons.forEach(btn => {
            if (parseInt(btn.dataset.duration) === parseInt(value)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // Function to sync duration controls
    function syncDuration(target, value) {
        const slider = document.querySelector(`.duration-slider[data-target="${target}"]`);
        const input = document.querySelector(`.duration-input[data-target="${target}"]`);
        const label = slider.closest('div').parentElement.querySelector('.duration-label');

        // Clamp slider value to its range
        const sliderValue = Math.min(Math.max(value, slider.min), slider.max);

        slider.value = sliderValue;
        input.value = value;
        label.textContent = formatDuration(value);

        // Update active preset
        updateActivePreset(target, value);

        // Update color timeline visualization
        renderColorTimeline();
    }

    // Setup all duration sliders
    document.querySelectorAll('.duration-slider').forEach(slider => {
        const target = slider.dataset.target;

        // Initialize
        syncDuration(target, slider.value);

        slider.addEventListener('input', function() {
            syncDuration(target, this.value);
        });
    });

    // Setup all duration inputs
    document.querySelectorAll('.duration-input').forEach(input => {
        const target = input.dataset.target;

        input.addEventListener('input', function() {
            syncDuration(target, this.value);
        });
    });

    // Setup preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const target = this.dataset.target;
            const duration = this.dataset.duration;
            syncDuration(target, duration);
        });
    });
});

<script>
    // ========================================
    // FADE TRANSITIONS - Click to Black → Navigate → Fade from Black
    // ========================================

    // Fade from black is now controlled by effects.js
    // After i18n translations are applied to prevent FOUC (Flash of Unstyled Content)

    // Fallback: show after 2.5s even if effects.js doesn't trigger it
    setTimeout(function() {
        if (!document.body.classList.contains('loaded')) {
            console.warn('[Fade] Fallback: forcing fade-in after timeout');
            document.body.classList.add('loaded');
        }
    }, 2500);

    // ========================================
    // EFFECT DELETE FUNCTIONALITY
    // ========================================

    // Extract delete handler for reuse
    function handleDeleteClick(e) {
        e.stopPropagation();

        const effectCard = this.closest('.effect-card');
        const effectName = effectCard.querySelector('.font-bold').textContent.trim();

        if (confirm(`Delete effect "${effectName}"?\n\nThis action cannot be undone.`)) {
            effectCard.style.transition = 'all 0.3s ease';
            effectCard.style.opacity = '0';
            effectCard.style.transform = 'translateX(-20px)';

            setTimeout(() => {
                effectCard.remove();
                console.log(`Effect "${effectName}" deleted successfully`);
            }, 300);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Handle delete button clicks
        const deleteButtons = document.querySelectorAll('.effect-delete-btn');

        deleteButtons.forEach(btn => {
            btn.addEventListener('click', handleDeleteClick);
        });
    });

    // Intercept navigation links for fade to black
    document.addEventListener('DOMContentLoaded', function() {
        const links = document.querySelectorAll('a[href]');

        links.forEach(link => {
            // Skip external links, anchors, javascript:, and absolute URLs
            const href = link.getAttribute('href');
            if (!href ||
                href.startsWith('#') ||
                href.startsWith('javascript:') ||
                href.startsWith('http://') ||
                href.startsWith('https://') ||
                href.includes('://')) {
                return;
            }

            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.href;

                // Disable all links during transition
                document.body.style.pointerEvents = 'none';

                // Fade to black
                document.body.classList.remove('loaded');
                document.body.classList.add('fade-out');

                // Navigate after fade completes (300ms)
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 300);
            });
        });
    });

    // ========================================
    // CUSTOM DROPDOWN FUNCTIONALITY
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
        const dropdowns = document.querySelectorAll('.custom-dropdown');

        dropdowns.forEach(dropdown => {
            const button = dropdown.querySelector('.dropdown-button');
            const menu = dropdown.querySelector('.dropdown-menu');
            const items = dropdown.querySelectorAll('.dropdown-item');
            const selected = button.querySelector('.dropdown-selected');

            // Toggle menu on button click
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = !menu.classList.contains('hidden');

                // Close all other dropdowns
                document.querySelectorAll('.custom-dropdown .dropdown-menu').forEach(m => {
                    if (m !== menu) {
                        m.classList.add('hidden');
                        m.parentElement.querySelector('.dropdown-button').classList.remove('active');
                    }
                });

                if (isOpen) {
                    menu.classList.add('hidden');
                    button.classList.remove('active');
                } else {
                    menu.classList.remove('hidden');
                    button.classList.add('active');
                }
            });

            // Select item on click
            items.forEach(item => {
                item.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    const text = this.textContent;

                    // Update selected text
                    selected.textContent = text;

                    // Update selected item styling
                    items.forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');

                    // Sync value to sibling hidden input
                    const hiddenInput = dropdown.parentElement.querySelector('input[type="hidden"]');
                    if (hiddenInput) hiddenInput.value = value;

                    // Close menu
                    menu.classList.add('hidden');
                    button.classList.remove('active');
                });
            });

            // Set first item as selected by default
            if (items.length > 0) {
                items[0].classList.add('selected');
            }
        });

        // Close all dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.custom-dropdown .dropdown-menu').forEach(menu => {
                    menu.classList.add('hidden');
                    menu.parentElement.querySelector('.dropdown-button').classList.remove('active');
                });
            }
        });
    });

    // Drag and drop functionality moved to effects.js
    // See setupDragAndDrop() function
</script>
